<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>chapter 1.</title>
  <style>
    :root {
      --bg: #d9d9d9;
      --ink: #171411;
      --accent: #9a1f1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
      font-family: 'Fira Code', monospace;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      position: relative;
      min-height: 100vh;
      background: var(--bg);
      overflow: hidden;
    }

.edgar {
  position: absolute;
  top: 0;
  right: 0;
  width: 320px;
  height: 100%;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.edgar {
  position: absolute;
  top: 0;
  left: 100;
  width: 960px;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
  opacity: 1;
  animation: edgar-flicker 5.8s steps(1, end) infinite;
}

@keyframes edgar-flicker {
  0% { opacity: 1; }
  8% { opacity: 0.65; }
  12% { opacity: 1; }
  29% { opacity: 0.35; }
  33% { opacity: 1; }
  61% { opacity: 0.1; }
  66% { opacity: 0.92; }
  84% { opacity: 0.25; }
  88% { opacity: 1; }
  100% { opacity: 1; }
}
    .content {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      padding: 0 28px 72px;
    }

    .film {
      display: block;
      width: 54%;
      max-width: 560px;
      margin-top: 20px;
      margin-left: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    .text-block {
      margin-top: 60px;
      margin-left: 26px;
      width: min(520px, 42vw);
      color: var(--ink);
      font-size: 12px;
      line-height: 1.55;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .text-block p {
      margin-bottom: 22px;
    }

    .home-link {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 3;
      font-size: 15px;
      text-transform: uppercase;
      color: var(--accent);
      text-decoration: underline;
      letter-spacing: 0.03em;
    }

    @media (max-width: 500px) {
      .film {
        width: 68%;
      }

      .text-block {
        width: min(520px, 62vw);
      }

    }

    @media (max-width: 500px) {
      .page {
        margin: 12px;
      }

      .content {
        padding: 0 14px 56px;
      }

      .film {
        width: 100%;
        max-width: none;
      }

      .text-block {
        margin-top: 34px;
        margin-left: 8px;
        width: calc(100% - 16px);
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="edgar" aria-hidden="true">
      <img src="assets/edgar.png" alt="" class="edgar">
    </div>

    <div class="content">
      <img src="assets/film.png" alt=" film still" class="film">

      <section class="text-block">
        <p>
          Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.
        </p>
      </section>
    </div>

    <a class="home-link" href="redtenda.html">Home</a>
  </main>
</body>
</html>
